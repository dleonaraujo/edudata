<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EduData - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #2c6e8a; font-size: 2em; }
        .logo p { color: #666; font-size: 0.9em; }
        label { display: block; margin-bottom: 5px; color: #333; font-size: 14px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        input:focus { outline: none; border-color: #2c6e8a; }
        button { width: 100%; padding: 12px; background: #2c6e8a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1a4f63; }
        .error { background: #ffe0e0; color: #c0392b; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        .footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <h1>🎓 EduData</h1>
            <p>Plataforma de Predicción de Deserción Escolar</p>
            <p style="color:#999; font-size:0.8em;">Arequipa - Peru</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Usuario:</label>
            <input type="text" name="username" placeholder="Ingresa tu usuario" required autofocus>

            <label>Contraseña:</label>
            <input type="password" name="password" placeholder="Ingresa tu contraseña" required>

            <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="footer">
            <p>Sistema de uso interno — Universidad La Salle</p>
        </div>
    </div>
</body>
</html>
